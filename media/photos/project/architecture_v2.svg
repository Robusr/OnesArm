<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-label="OnesArm v2 system architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>
  <text x="40" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2937">OnesArm v2</text>
  <text x="40" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6b7280">Modular serial robotic arm · current platform</text>
  <rect x="710" y="26" width="150" height="32" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="785" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2e7d32" text-anchor="middle">v2 current</text>

  <g filter="url(#shadow)">
    <rect x="250" y="90" width="400" height="80" rx="12" fill="#e8f1fb" stroke="#00549f" stroke-width="1.5"/>
  </g>
  <text x="450" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b3d66" text-anchor="middle">End effector</text>
  <text x="450" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">parallel gripper · ultrasonic · gas sensor · pen</text>

  <g filter="url(#shadow)">
    <rect x="250" y="205" width="400" height="90" rx="12" fill="#eaf5ec" stroke="#2e7d32" stroke-width="1.5"/>
  </g>
  <text x="450" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b5e20" text-anchor="middle">Link module</text>
  <text x="450" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">X-X / X-Y / short link · 5 mm 5052 aluminium + carbon tube</text>
  <text x="450" y="281" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">M5 connection nodes</text>

  <g filter="url(#shadow)">
    <rect x="250" y="330" width="400" height="110" rx="12" fill="#eaf5ec" stroke="#2e7d32" stroke-width="1.5"/>
  </g>
  <text x="450" y="361" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b5e20" text-anchor="middle">Joint module</text>
  <text x="450" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">45° / 90° · 42BYGH47 + FLE-42-20 (1:20)</text>
  <text x="450" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">STM32F103C8T6 CAN module · magnetic encoder</text>

  <g filter="url(#shadow)">
    <rect x="250" y="475" width="400" height="105" rx="12" fill="#e8f1fb" stroke="#00549f" stroke-width="1.5"/>
  </g>
  <text x="450" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b3d66" text-anchor="middle">Base platform</text>
  <text x="450" y="531" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">4040 aluminium profile · 350 W supply</text>
  <text x="450" y="553" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle">STM32F407ZGT6 CAN controller</text>

  <line x1="450" y1="170" x2="450" y2="205" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">T/N interface</text>
  <line x1="450" y1="295" x2="450" y2="330" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">T/N interface</text>
  <line x1="450" y1="440" x2="450" y2="475" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6b7280">T/N interface</text>

  <g filter="url(#shadow)">
    <rect x="700" y="330" width="165" height="110" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  </g>
  <text x="782" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#374151" text-anchor="middle">CAN bus + power</text>
  <text x="782" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">TJA1050 transceiver</text>
  <text x="782" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">350 W DC · XT60</text>
  <text x="782" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">LM2596 5 V logic</text>
  <path d="M 650 385 H 700" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M 650 527 H 700 V 440" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>

  <rect x="30" y="330" width="185" height="140" rx="12" fill="#fafafa" stroke="#d1d5db" stroke-width="1"/>
  <text x="45" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">Legend</text>
  <rect x="45" y="372" width="14" height="14" fill="#e8f1fb" stroke="#00549f"/>
  <text x="68" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">Structure / platform</text>
  <rect x="45" y="398" width="14" height="14" fill="#eaf5ec" stroke="#2e7d32"/>
  <text x="68" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">Drive / control</text>
  <rect x="45" y="424" width="14" height="14" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="68" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">Interface / bus</text>

  <text x="450" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">24 joint layouts · 4-DOF AyCxBy-D analysis · 4040 platform</text>
</svg>
